name: Arilinc
description: >-
  Aril Inc. (Arilinc) is a fabless semiconductor company in Los Gatos, California
  designing efficient AI processors and memory technology for edge inference. Its two
  core products are the Aril Standard Cell Memory, a patented on-chip memory offering
  roughly 40% lower active power and 3.6x smaller area, and a scalable RISC-V-based AI
  Processor Engine delivering hundreds of TOPS of inference per block with integrated
  vector and matrix engines. The company targets robotics, industrial automation,
  drones, defense and aerospace, autonomous vehicles, and edge vision systems where
  power efficiency is critical. Founded by a team of engineers who have collectively
  shipped 20M+ processors and worked on silicon for Cisco, Intel, AMD, and Google.
  Arilinc sells custom silicon and IP to hardware makers rather than a public developer
  API; it publishes no API, SDK, developer portal, or programmatic surface at this time.
